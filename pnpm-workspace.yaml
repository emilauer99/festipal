packages:
  - "apps/*"
  - "packages/*"

# Windows: RN/Expo native Android builds (CMake/ninja) break on pnpm's isolated
# store — deep node_modules/.pnpm paths exceed object-path limits and junction
# resolution makes ninja loop ("manifest still dirty after 100 tries").
# Hoisted layout = flat npm-style node_modules. See phase 03-06.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

# Allow these dependencies to run install/build scripts (pnpm blocks them by default).
onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - expo-location@57.0.10
